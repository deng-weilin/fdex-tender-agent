name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python tools/task_acceptance.py verify-kit
      - run: python -m unittest discover -s tests -v
      - name: Run the linked learner task acceptance suite
        if: github.event_name == 'pull_request'
        run: python tools/run_pr_acceptance.py
      - run: python -m fdex_tender run --input samples/e2e/core-normal --output outputs/ci-normal
      - run: python -m fdex_tender run --input samples/e2e/replacement --output outputs/ci-replacement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-core-results
          path: outputs/
